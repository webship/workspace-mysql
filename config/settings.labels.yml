# Labels for core/config/plugin.mysql.settings.yml, merged into the Settings page.
admin:
  label: Web admin
  info: 'What the DATABASE menu offers to open a MySQL database in a browser. On DDEV each is the official add-on (ddev/ddev-adminer, ddev/ddev-phpmyadmin), added to a project the first time it is asked for, and the project restarted. The other runtimes cannot add a web admin to a project yet.'
  options:
    both: Adminer and phpMyAdmin
    adminer: Adminer
    phpmyadmin: phpMyAdmin
    none: None
keep:
  label: Exports kept per project
  info: 'How many exports of one project the backups folder keeps. When a new one is made the oldest go, the exports made before an import among them. 0 keeps every one.'
  number:
    min: 0
    max: 1000
    step: 1
    unit: exports, 0 keeps every one
